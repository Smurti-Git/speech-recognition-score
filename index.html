<!DOCTYPE html>
<html>
<head>
    <title>Speech Recognition with Scores</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
   
</head>
<body>
   <button id="start" accesskey="r">Start Recognition</button>
 <button id="copy" accesskey="c">Copy</button>
 <button onclick="checkMatch()">Check Match</button>
 <button id="clear" accesskey="x">Clear</button>
 <br><br>
 <textarea id="textareaInput" name="textareaInput" rows="10" cols="40" ></textarea>
<br>
<button id="saveHistory" accesskey="h">Save History</button>
<button id="copyToInput" accesskey="i">Copy to Input</button>

<aside id="totalScore">Total Score: 0</aside>
 <br>
 <form id="inputForm" onsubmit="addToList(); return false;">
 <label for="textInput">Text:</label> 
<input type="text" id="textInput" name="textInput" required>
 <label for="numberInput">Score:</label>
 <input type="number" id="numberInput" name="numberInput" accesskey="s" required>
 <button type="submit" name="add">Add</button>
 </form> 
<h3><u>Parameters:-<u/></h3>
<ul id="list"></ul>

 <br>
<aside id="historySection">
    <h3><u>History :<u/></h3>
    <ul id="historyList"></ul>
</aside>


 <script src="script.js" defer></script>

</body>
</html>
